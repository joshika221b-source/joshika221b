<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" font-family="'Fira Code','JetBrains Mono',Consolas,'SF Mono','DejaVu Sans Mono','Courier New',monospace"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="l1"><stop offset="0" stop-color="#FF4FA3" stop-opacity="0"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient><linearGradient id="l2"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/></linearGradient><style>.dot{animation:dt 4.5s linear infinite}@keyframes dt{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(900px);opacity:0}}.hb{animation:hb 1.6s ease-in-out infinite alternate}@keyframes hb{from{opacity:.55}to{opacity:1}}</style></defs><rect x="0" y="13" width="400" height="2" fill="url(#l1)"/><rect x="500" y="13" width="400" height="2" fill="url(#l2)"/><text class="hb" x="450" y="20" text-anchor="middle" font-size="15" fill="#FF4FA3">♡ ✦ ♡</text><circle class="dot" cx="0" cy="14" r="3" fill="#F4F0FF" filter="url(#glow)"/></svg>